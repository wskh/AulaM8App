name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Fix Android gitignore for CI
      run: |
        cd android
        # Remove lines that block cap sync in CI
        sed -i '/^capacitor-cordova-android-plugins$/d' .gitignore
        sed -i '/^app\/src\/main\/assets\/public$/d' .gitignore
        sed -i '/^app\/src\/main\/assets\/capacitor.config.json$/d' .gitignore
        sed -i '/^app\/src\/main\/assets\/capacitor.plugins.json$/d' .gitignore
        sed -i '/^app\/src\/main\/res\/xml\/config.xml$/d' .gitignore
        echo "Android .gitignore fixed"
    
    - name: Sync Capacitor
      run: npx cap sync android
    
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: aula-m8-apk
        path: android/app/build/outputs/apk/debug/*.apk
        retention-days: 90
